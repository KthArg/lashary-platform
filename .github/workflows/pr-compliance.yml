# Agente revisor de cumplimiento — corre en cada PR, sin que nadie lo invoque (§11.8).
# Read-only: comenta hallazgos con rule IDs; jamás aprueba, mergea ni modifica la rama.
# Advisorio (Capa 4): la compuerta bloqueante es el workflow ci.yml + branch protection.
#
# Autenticación: token OAuth de la suscripción Claude Pro/Max (sin API de pago por uso).
# Setup más fácil: correr `claude /install-github-app` en la terminal de Claude Code — configura
# la app y el secreto CLAUDE_CODE_OAUTH_TOKEN solo; alternativa manual: `claude setup-token` y
# pegar el resultado como secreto del repo. Al configurar, pinnear la action por SHA (SEC-008).
name: pr-compliance
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write # solo para publicar el comentario de revisión
  issues: write
  id-token: write # OIDC: la action lo canjea por su token de app de GitHub
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    # sin secretos de Supabase en este job: el agente no los necesita y no debe tenerlos (SEC-003)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: revisar PR
        # Advisorio de verdad: un job en rojo se lee como compuerta y ensucia los checks
        # del PR. La señal de este agente es su comentario, no el estado del job. Si el
        # comentario no aparece, ahí se mira el log.
        continue-on-error: true
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1, pinneada por SHA (SEC-008)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true # crea el comentario único del PR que Claude actualiza con el resultado
          prompt: |
            Lee .agents/pr-compliance-reviewer.md y síguelo al pie de la letra.
            Revisa el diff de este PR contra la rama base. Tu respuesta final ES el
            comentario de revisión: escríbela completa en el formato que ese
            documento define.
          # Leer el diff ES el trabajo de este agente. Sin estas herramientas cada intento
          # se deniega y quema un turno (se vieron 3-12 denials por run). Todas son de
          # lectura: el límite read-only del agente lo sostiene esta lista, no el techo de turnos.
          # 60 turnos: los runs reales terminaron en 33, 35 y 49 — con 25 fallaban aun al
          # completar la revisión con éxito.
          claude_args: >-
            --max-turns 60
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
