# CI — Capa 1: la única compuerta real (docs/spec/INTEGRATION.md).
# Corre exactamente los mismos scripts que scripts/verify.sh local: una implementación, cero deriva.
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  rules:
    name: reglas (rules.yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historia completa: INT-001 (edad de rama) y diffs contra base

      - name: verify (contra la rama base)
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch origin "${{ github.base_ref }}"
            bash scripts/verify.sh --base "origin/${{ github.base_ref }}"
          else
            # push a main: solo checks estáticos (sin rango de PR)
            bash scripts/verify.sh --base "HEAD~1" || exit 1
          fi

  # job-tests-reales — pruebas de la aplicación. Lo porta US-AGE-08 como primera historia con
  # código (ADR-0007). Hoy: unitarias (vitest). Se le suman en sus incrementos: aislamiento RLS
  # (SEC-002, contra Supabase local) y concurrencia (DOM-010) cuando esas historias lleguen.
  job-tests-reales:
    name: pruebas (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  # Guardia estructural: si hay código en src/ y el job de arriba desapareciera, esto falla.
  tests-placeholder-guard:
    name: guardia de pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: código en src/ exige job de tests
        run: |
          # SPECs stub y la plantilla _template no son código; el primer .ts/.tsx real sí
          CODE=$(find src -path 'src/features/_template' -prune -o \( -name '*.ts' -o -name '*.tsx' \) -print 2>/dev/null | head -n 1)
          if [ -n "$CODE" ] && ! grep -q "job-tests-reales" .github/workflows/ci.yml; then
            echo "✖ Hay código en src/ ($CODE) pero este workflow no tiene job de tests (marcador: job-tests-reales)."
            echo "  Agregar el job de tests es parte de la primera historia que cree código (ver ADR-0007: la porta la primera historia con código)."
            exit 1
          fi
          echo "OK"
