# CI — Capa 1: la única compuerta real (docs/spec/INTEGRATION.md).
# Corre exactamente los mismos scripts que scripts/verify.sh local: una implementación, cero deriva.
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  rules:
    name: reglas (rules.yaml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historia completa: INT-001 (edad de rama) y diffs contra base

      - name: verify (contra la rama base)
        env:
          # check-pr-size.sh exime el PR us/<ID> → main (INT-001, INT-002).
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch origin "${{ github.base_ref }}"
            bash scripts/verify.sh --base "origin/${{ github.base_ref }}"
          else
            # push a main: solo checks estáticos (sin rango de PR)
            bash scripts/verify.sh --base "HEAD~1" || exit 1
          fi

  # job-tests-reales — pruebas de la aplicación. Lo porta US-AGE-08 como primera historia con
  # código (ADR-0007). Unitarias (vitest) + integración y aislamiento RLS (SEC-002) contra un
  # Supabase local. La concurrencia (DOM-010) se suma cuando llegue esa historia.
  job-tests-reales:
    name: pruebas (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Supabase local (harness de aislamiento RLS — SEC-002)
        run: |
          npx supabase start
          npx supabase db reset --local
          S=$(npx supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$S" | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$S" | jq -r .ANON_KEY)"
          } >> .env.local
      - run: npm test

  # e2e — Playwright contra el build de producción (playwright.config.ts levanta el servidor).
  # Lo porta US-LAND-01: criterio 2, "visible" en los anchos de e2e/support/viewports.ts.
  # Sin Supabase: las páginas públicas no lo necesitan y el config pone valores de relleno.
  job-e2e:
    name: pruebas e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Siempre: el reporte trae las capturas de la landing que el PO aprueba (US-LAND-01,
      # criterio 2 "atractivo"), y si algo falla, el detalle del fallo.
      - name: reporte e2e y capturas de la landing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-landing
          path: playwright-report/
          retention-days: 14

  # Guardia estructural: si hay código en src/ y el job de arriba desapareciera, esto falla.
  tests-placeholder-guard:
    name: guardia de pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: código en src/ exige job de tests
        run: |
          # SPECs stub y la plantilla _template no son código; el primer .ts/.tsx real sí
          CODE=$(find src -path 'src/features/_template' -prune -o \( -name '*.ts' -o -name '*.tsx' \) -print 2>/dev/null | head -n 1)
          if [ -n "$CODE" ] && ! grep -q "job-tests-reales" .github/workflows/ci.yml; then
            echo "✖ Hay código en src/ ($CODE) pero este workflow no tiene job de tests (marcador: job-tests-reales)."
            echo "  Agregar el job de tests es parte de la primera historia que cree código (ver ADR-0007: la porta la primera historia con código)."
            exit 1
          fi
          echo "OK"
