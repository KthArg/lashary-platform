services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations/20260912000000_store_products.sql:/docker-entrypoint-initdb.d/20260912000000_store_products.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v16.3
    environment:
      PGRST_DB_URI: postgresql://authenticator:postgres@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: '{"keys":[{"kty":"oct","alg":"HS256","use":"sig","kid":"lashary-local","k":"bGFzaGFyeS1sb2NhbC1qd3Qtc2VjcmV0LTIwMjYtMDktMTI"}]}'
      PGRST_SERVER_PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgrest

volumes:
  postgres_data:
